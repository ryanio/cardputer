; flint's own build. The board, the libraries and the flags live in flint.ini,
; which an app pack in another repository includes as well, so the two cannot
; drift apart. See docs/APPS.md.
;
;   pio run                 compile the firmware
;   pio run -t upload       flash it
;   pio run -e sim -t exec  the same views on the desktop
[platformio]
default_envs = cardputer-adv
extra_configs = flint.ini
; The project root, not src/. flint.ini explains why: a filter pattern that
; climbs out of src_dir with `..` puts its objects in a directory every
; environment shares. Building from the root means every pattern points down.
src_dir = .

; Where flint sits, relative to src_dir. Here that is right here. An app pack
; vendoring flint at ./flint says `dir = flint` and changes nothing else.
[flint]
dir = .

[env:cardputer-adv]
extends = flint_adv

[env:sim]
extends = flint_sim
