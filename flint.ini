; flint as a platform, for an app that lives in its own repository.
;
; An app pack is a directory of views in someone else's tree, built against
; flint rather than added to it. This file is the half flint owns: the board,
; the libraries and the flags, with nothing in it that assumes where flint sits
; on disk.
;
; Two rules make that work, and both are the consumer's one time cost:
;
;   1. `src_dir` is the project root, not a source directory. Every filter
;      pattern is then a path down from it, and PlatformIO keeps each
;      environment's objects under that environment. A pattern that climbs out
;      with `..` lands its objects in a directory shared by every environment,
;      where a simulator build and a device build overwrite each other.
;   2. `[flint] dir` says where flint is, relative to that root. This file
;      never defines it, because extra_configs are read after the file that
;      included them and would win.
;
; A project that vendors flint as a submodule at ./flint therefore starts:
;
;   [platformio]
;   src_dir = .
;   extra_configs = flint/flint.ini
;   default_envs = myapp-adv
;
;   [flint]
;   dir = flint
;
;   [env:myapp-adv]
;   extends = flint_adv
;   build_src_filter =
;       ${flint_adv.build_src_filter}
;       -<${flint.dir}/src/views/>   ; flint's own apps stay out of this build
;       +<app/src/*>                 ; yours go in
;   build_flags =
;       ${flint_adv.build_flags}
;       -Iapp/src
;       -DFLINT_PROFILE='"myapp"'
;       -DFLINT_PROFILE_VIEWS='"My App"'
;       -DFLINT_PROFILE_NETWORK=0
;
; The three defines are the profile, declared in flags because an app pack
; cannot add a row to the table in src/profile.cpp. Views register themselves;
; view::appBegin is the hook for anything else the app has to start. See
; docs/APPS.md.
;
; flint_adv and flint_sim are plain sections rather than environments on
; purpose: an including project gets the settings without also getting two
; environments it never meant to build.

; Cardputer ADV (K132-ADV). Stamp-S3A / ESP32-S3FN8, 8MB flash.
[flint_adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv

; M5Cardputer 1.1.1+ is the first release that drives the ADV's TCA8418
; keyboard controller. The original Cardputer used a 74HC138 and the older
; library will not read keys on this board.
lib_deps =
	m5stack/M5Cardputer@^1.1.1
	m5stack/M5Unified@^0.2.8
	m5stack/M5GFX@^0.2.10
	bblanchon/ArduinoJson@^7.2.0

; The framework defaults to gnu++11, where a struct with default member
; initializers is not an aggregate, so a view could not be declared as a plain
; brace list.
build_unflags = -std=gnu++11

build_src_filter = +<${flint.dir}/src/>

build_flags =
	-std=gnu++17
	; Spelled out rather than left to PlatformIO, because src_dir is the
	; project root here and flint's headers are a directory down from it.
	-I${flint.dir}/src
	-I${flint.dir}/include
	-DCORE_DEBUG_LEVEL=3
	; The boot report goes out the USB-C port, which is wired to the S3's
	; native USB. The board sets ARDUINO_USB_MODE=1 but not this, and without
	; it the core points Serial at UART0, where nothing on this unit listens.
	-DARDUINO_USB_CDC_ON_BOOT=1
	; The Arduino loop task runs the TLS handshake, and 8KB of stack is not
	; enough headroom for it beside our own frames.
	-DARDUINO_LOOP_STACK_SIZE=16384

; The simulator. Same view, ui and store code, running against M5GFX's own SDL
; panel as a Cardputer ADV, so the pixels and the fonts are the real ones. The
; ring around it is shimmed in sim/: keys from SDL, a battery we can set, and a
; network that answers from sim/src/net_sim.cpp.
;
;   omarchy pkg add sdl2      or: brew install sdl2
[flint_sim]
platform = native
build_type = debug
lib_deps =
	m5stack/M5GFX@^0.2.10
	bblanchon/ArduinoJson@^7.2.0
build_src_filter =
	+<${flint.dir}/src/>
	-<${flint.dir}/src/main.cpp>
	-<${flint.dir}/src/net.cpp>
	-<${flint.dir}/src/jpeg.cpp>
	+<${flint.dir}/sim/src/>
	-<${flint.dir}/sim/src/main_web.cpp>
build_flags =
	-std=gnu++17
	-O1
	-I${flint.dir}/src
	-I${flint.dir}/sim/include
	-DM5GFX_BOARD=board_M5CardputerADV
	-DM5GFX_SHOW_FRAME
	-DM5GFX_SCALE=3
	-DM5GFX_BACK_COLOR=0x141416u
	-DARDUINOJSON_ENABLE_ARDUINO_STRING=0
	-DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
	-DARDUINOJSON_ENABLE_PROGMEM=0
	; Ask SDL where it is rather than guessing at a homebrew prefix. M5GFX
	; probes for <SDL2/SDL.h> first, so the parent directory has to be on the
	; path too or it decides this is an unknown platform.
	!sdl2-config --cflags
	!echo "-I$(sdl2-config --prefix)/include"
	!sdl2-config --libs
